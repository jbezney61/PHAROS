[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "pharos-cell"
version = "0.1.0a0"
description = "Target-directed drug-combination screening from single-cell state embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jonathan Bezney" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata==0.12.14",
  "huggingface-hub==1.14.0",
  "matplotlib==3.10.9",
  "numpy==2.4.4",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "scanpy==1.11.5",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "torch==2.7.1",
  "typer==0.25.1",
  "umap-learn==0.5.12",
]

[project.urls]
Homepage = "https://github.com/jbezney61/PHAROS"
Repository = "https://github.com/jbezney61/PHAROS"
Issues = "https://github.com/jbezney61/PHAROS/issues"

[project.scripts]
pharos = "pharos_cell.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
